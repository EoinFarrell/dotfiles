---
# ansible-playbook --connection=local --inventory 127.0.0.1, --limit 127.0.0.1 provision.yaml
#
# Single cross-platform entry point, superseding base_setup.yaml and
# base_setup_debian.yaml. Fans out on ansible_os_family instead of the
# `uname`-in-shell branch updateMachine used to pick a playbook name with.
- name: "Provision"
  hosts: 127.0.0.1
  connection: local
  gather_facts: yes
  vars_files:
    - vars/homebrew_packages.yml
  tasks:
    - name: Install Oh My Zsh
      ansible.builtin.include_tasks: tasks/oh_my_zsh.yaml

    - name: macOS-specific setup
      ansible.builtin.include_tasks: tasks/macos.yaml
      when: ansible_os_family == 'Darwin'

    - name: Debian-specific setup
      ansible.builtin.include_tasks: tasks/debian.yaml
      when: ansible_os_family == 'Debian'

    - name: Install shared Homebrew packages
      ansible.builtin.include_tasks: tasks/homebrew_packages.yaml

    - name: Install asdf-managed language runtimes
      ansible.builtin.include_tasks: tasks/asdf_tool_versions.yaml

    - name: Debian finalizer (reboot check + autoremove)
      ansible.builtin.include_tasks: tasks/debian_finalize.yaml
      when: ansible_os_family == 'Debian'
