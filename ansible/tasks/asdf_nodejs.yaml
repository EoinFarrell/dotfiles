---
# Shared asdf + Node.js setup used by base_setup.yaml and base_setup_debian.yaml.
- name: Setup asdf vm dirs
  ansible.builtin.file:
    path: ~/.asdf
    state: directory
    recurse: yes

- name: Clone asdfvm
  ansible.builtin.git:
    repo: 'https://github.com/asdf-vm/asdf.git'
    dest: ~/.asdf

- name: Add asdf nodejs plugin
  ansible.builtin.shell: |
    export PATH="${HOME}/.asdf/bin:${PATH}"
    asdf plugin add nodejs https://github.com/asdf-vm/asdf-nodejs.git
  args:
    creates: ~/.asdf/plugins/nodejs

- name: Install default Node.js version
  ansible.builtin.shell: |
    export PATH="${HOME}/.asdf/bin:${PATH}"
    asdf install nodejs {{ nodejs_version }}
    asdf global nodejs {{ nodejs_version }}
  args:
    creates: ~/.asdf/installs/nodejs/{{ nodejs_version }}/bin/node
  vars:
    nodejs_version: "22.14.0"
