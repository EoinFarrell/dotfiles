# Shared Oh My Zsh install, included by provision.yaml on both macOS and
# Debian. Idempotent: only runs when ~/.zshrc doesn't already exist. The
# installer writes its own ~/.zshrc, but git_setup.yaml's link step removes
# and replaces it with our symlinked zshrc afterward, so nothing here needs
# to clean it up.
- name: Check that ~/.zshrc exists
  ansible.builtin.stat:
    path: ~/.zshrc
  register: zshrc_stat_result

- name: Create tmp dir for the installer
  ansible.builtin.file:
    path: ~/tmp
    state: directory
  when: not zshrc_stat_result.stat.exists

- name: Download Oh My Zsh installer
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh
    dest: ~/tmp/zsh-installer.sh
    mode: '0755'
  when: not zshrc_stat_result.stat.exists

- name: Run the Oh My Zsh installer
  ansible.builtin.shell: ~/tmp/zsh-installer.sh
  when: not zshrc_stat_result.stat.exists

- name: Remove the Oh My Zsh installer
  ansible.builtin.file:
    path: ~/tmp/zsh-installer.sh
    state: absent
  when: not zshrc_stat_result.stat.exists
