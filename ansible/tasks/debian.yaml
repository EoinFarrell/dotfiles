# Debian-specific setup, included by provision.yaml when
# ansible_os_family == 'Debian'. Bootstraps Linuxbrew (macOS ships with
# Homebrew already installed manually, so tasks/macos.yaml has no
# equivalent step).
- name: Create Tmp dir
  ansible.builtin.file:
    path: ~/tmp
    state: directory

### Add Repos ###

- name: Get DEB architecture
  ansible.builtin.shell: dpkg --print-architecture
  register: deb_architecture

- name: Setup Keyring
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

# deb822_repository respawns itself under the system Python to reach the
# python-debian bindings, which aren't present in Linuxbrew's Python.
# Install the package providing them before the repo tasks run.
- name: Install python3-debian (needed by deb822_repository)
  ansible.builtin.apt:
    name: python3-debian
    update_cache: false
  become: true

# The deb822_repository tasks below don't refresh the apt cache (the
# module never does one), and the apt tasks here pass update_cache: false.
# "Update and upgrade apt packages" below does the single combined
# `apt-get update` we actually need (and skips it entirely within
# cache_valid_time), so repos added here are still picked up by it.
#
# signed_by takes the key URL directly — deb822_repository downloads it to
# /etc/apt/keyrings/<name>.{asc,gpg} and wires up Signed-By, replacing the
# separate get_url key tasks the old apt_repository form needed.
- name: Add docker apt repo
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    uris: https://download.docker.com/linux/debian
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: stable
    architectures: "{{ deb_architecture.stdout }}"
    signed_by: https://download.docker.com/linux/debian/gpg
    state: present
  become: true

- name: Add Terraform apt repo
  ansible.builtin.deb822_repository:
    name: terraform
    types: deb
    uris: https://apt.releases.hashicorp.com
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: main
    architectures: "{{ deb_architecture.stdout }}"
    signed_by: https://apt.releases.hashicorp.com/gpg
    state: present
  become: true

- name: Add Tailscale apt repo
  ansible.builtin.deb822_repository:
    name: tailscale
    types: deb
    uris: https://pkgs.tailscale.com/stable/debian
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: main
    signed_by: https://pkgs.tailscale.com/stable/debian/bookworm.noarmor.gpg
    state: present
  become: true

- name: Add Debian Contrib & Non-Free apt repo (steam)
  ansible.builtin.deb822_repository:
    name: debian-contrib-nonfree
    types: deb
    uris: http://deb.debian.org/debian
    suites: "{{ ansible_facts['distribution_release'] }}"
    components:
      - contrib
      - non-free
    state: present
  become: true

# deb822_repository writes .sources files; the ansible.builtin.apt_repository
# tasks it replaced left .list files behind. Remove them so each repo isn't
# defined twice. One-time migration — drop this task once every machine
# (macOS, nr200p, t480) has run the converted playbook at least once.
- name: Remove legacy apt_repository .list files
  ansible.builtin.file:
    path: "/etc/apt/sources.list.d/{{ item }}"
    state: absent
  loop:
    - download_docker_com_linux_debian.list
    - apt_releases_hashicorp_com.list
    - pkgs_tailscale_com_stable_debian.list
    - deb_debian_org_debian.list
  become: true

### Install Packages ###

- name: Install aptitude
  ansible.builtin.apt:
    name: aptitude
    state: latest
    update_cache: false
  become: true

- name: Update and upgrade apt packages
  ansible.builtin.apt:
    upgrade: yes
    update_cache: yes
    cache_valid_time: 86400
  become: true

- name: Install base packages
  ansible.builtin.apt:
    pkg:
      # OS-level packages and Linuxbrew's own system dependencies only.
      # User/CLI tools live in vars/homebrew_packages.yml instead — see
      # docs/adr/0001-homebrew-for-user-cli-tools.md.
      - apt-transport-https
      - build-essential
      - ca-certificates
      - curl
      - file
      - git # also needed to bootstrap Homebrew itself
      - gpg
      - gnupg
      - nfs-common
      - procps
      # - ghossty
      - software-properties-common
      # - steam-installer
      - tailscale
      - terraform
      # - openssh-server
    state: latest
    update_cache: false
  become: true

### Docker Install ###

- name: Install Docker packages
  ansible.builtin.apt:
    pkg:
      - gnupg-agent
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
  become: true

- name: Ensure group "docker" exists
  ansible.builtin.group:
    name: docker
    state: present
  become: true

- name: Add current user to docker group
  ansible.builtin.command: sudo usermod -aG docker $USER
  become: true

- name: Add feoin to docker group
  ansible.builtin.command: sudo usermod -aG docker feoin
  become: true

### ZSH default shell ###
# Oh My Zsh itself is installed by the shared tasks/oh_my_zsh.yaml; this
# just makes zsh the login shell, which macOS doesn't need (zsh has been
# the default there since Catalina).

- name: Set zsh as default shell for feoin
  ansible.builtin.user:
    name: feoin
    shell: /bin/zsh
  become: true

- name: Make Zsh default shell
  ansible.builtin.command: chsh -s /bin/zsh
  become: true

### Linuxbrew ###

- name: Check that /home/linuxbrew exists
  ansible.builtin.stat:
    path: /home/linuxbrew/.linuxbrew
  register: linuxbrew_stat_result
  become: true

- name: Download Linuxbrew installer
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh
    dest: ~/tmp/linuxbrew-installer.sh
    mode: '0755'
  when: not linuxbrew_stat_result.stat.exists

- name: Execute the Linuxbrew-installer.sh
  ansible.builtin.shell: ~/tmp/linuxbrew-installer.sh
  when: not linuxbrew_stat_result.stat.exists
  become: true

- name: Remove the Linuxbrew-installer.sh
  ansible.builtin.file:
    path: ~/tmp/linuxbrew-installer.sh
    state: absent
  when: not linuxbrew_stat_result.stat.exists

- name: Update Homebrew
  # Explicit, same as tasks/macos.yaml's equivalent step — otherwise this
  # never happens deliberately on Debian, and instead fires as a slow
  # surprise buried inside whatever brew command runs first (tap/install
  # in tasks/homebrew_packages.yaml, both of which set
  # HOMEBREW_NO_AUTO_UPDATE to stop that from happening again there).
  community.general.homebrew:
    update_homebrew: true

# Finalizer (reboot-required check + autoremove) is deliberately NOT here:
# in the original base_setup_debian.yaml it ran after the shared Homebrew
# packages/asdf steps, which are top-level tasks in provision.yaml that run
# after this file's include completes. It lives in tasks/debian_finalize.yaml
# instead, included at the end of provision.yaml, to preserve that order.
