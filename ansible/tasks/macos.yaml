# macOS-specific setup, included by provision.yaml when
# ansible_os_family == 'Darwin'. Assumes Homebrew itself is already
# installed (unlike Debian, which bootstraps Linuxbrew in tasks/debian.yaml).
- name: Update Homebrew
  community.general.homebrew:
    update_homebrew: true

- name: Install Casks
  community.general.homebrew:
    name: "homebrew/cask/{{ item }}"
    state: present
  environment:
    HOMEBREW_NO_AUTO_UPDATE: "1"
  loop:
    - devtoys
    - disk-inventory-x
    - docker
    - firefox
    # - google-chrome
    - grandperspective
    # - http-toolkit
    - jetbrains-toolbox
    - jordanbaird-ice
    - kdiff3
    - maccy
    - postman
    - rectangle
    # - slack
    - spotify
    - tigervnc-viewer
    - visual-studio-code
    - vlc
    # - zoom

- name: Remove Packages
  community.general.homebrew:
    name: "{{ item }}"
    state: absent
  loop:
    - fzf
  environment:
    HOMEBREW_NO_AUTO_UPDATE: "1"

- name: Install macOS-only Homebrew packages
  community.general.homebrew:
    name: "{{ item }}"
    state: present
  environment:
    HOMEBREW_NO_AUTO_UPDATE: "1"
  loop:
    # colima is a Docker Desktop replacement for macOS; Debian already
    # runs Docker Engine natively via apt, so it has no use there.
    - colima

# localsend and its tap are kept macOS-only rather than moved into the
# shared vars/homebrew_packages.yml list, since it's a GUI send/receive
# app with no meaningful Linux install path here (same reasoning as the
# casks above).
#
# localsend's cask install copies to /Applications via an internal sudo
# call that Homebrew shells out to itself — separate from Ansible's own
# become — so it prompts interactively and fails outright under MDM
# policies that block non-interactive admin auth. Gated behind
# mdm_gated_tasks (default false); run with `-e mdm_gated_tasks=true` on
# a machine where interactive sudo during provisioning is allowed.
- name: Tap Homebrew repositorys
  community.general.homebrew_tap:
    name: "{{ item }}"
    state: present
  environment:
    HOMEBREW_NO_AUTO_UPDATE: "1"
    HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"
  loop:
    - localsend/localsend
    # - sachaos/todoist
  when: mdm_gated_tasks

- name: Install Tap Packages
  community.general.homebrew:
    name: "{{ item }}"
    state: present
  environment:
    HOMEBREW_NO_AUTO_UPDATE: "1"
    HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"
  loop:
    - localsend
    # - todoist
  when: mdm_gated_tasks

- name: Find all custom fonts
  ansible.builtin.find:
    paths: ~/Code/personal/dotfiles/fonts
    patterns: '*.ttf'
  register: findFonts

- name: Install Fonts
  ansible.builtin.copy:
    src: "{{ item.path }}"
    dest: "/Library/Fonts/{{ item.path | basename }}"
  with_items: "{{ findFonts.files }}"

- name: Install Rosetta
  ansible.builtin.command: softwareupdate --install-rosetta --agree-to-license
