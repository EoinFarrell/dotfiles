# macOS-specific setup, included by provision.yaml when
# ansible_os_family == 'Darwin'. Assumes Homebrew itself is already
# installed (unlike Debian, which bootstraps Linuxbrew in tasks/debian.yaml).
- name: Update Homebrew
  community.general.homebrew:
    update_homebrew: true

- name: Install Casks
  community.general.homebrew:
    name: "homebrew/cask/{{ item }}"
    state: present
  environment:
    HOMEBREW_NO_AUTO_UPDATE: "1"
  loop:
    - devtoys
    - disk-inventory-x
    - docker
    - firefox
    # - google-chrome
    - grandperspective
    # - http-toolkit
    - jetbrains-toolbox
    - jordanbaird-ice
    - kdiff3
    - maccy
    - postman
    - rectangle
    # - slack
    - spotify
    - tigervnc-viewer
    - visual-studio-code
    - vlc
    # - zoom

- name: Remove Packages
  community.general.homebrew:
    name: "{{ item }}"
    state: absent
  loop:
    - fzf
  environment:
    HOMEBREW_NO_AUTO_UPDATE: "1"

- name: Install macOS-only Homebrew packages
  community.general.homebrew:
    name: "{{ item }}"
    state: present
  environment:
    HOMEBREW_NO_AUTO_UPDATE: "1"
  loop:
    # colima is a Docker Desktop replacement for macOS; Debian already
    # runs Docker Engine natively via apt, so it has no use there.
    - colima

# localsend and its tap are kept macOS-only rather than moved into the
# shared vars/homebrew_packages.yml list, since it's a GUI send/receive
# app with no meaningful Linux install path here (same reasoning as the
# casks above).
- name: Tap Homebrew repositorys
  community.general.homebrew_tap:
    name: "{{ item }}"
    state: present
  environment:
    HOMEBREW_NO_AUTO_UPDATE: "1"
  loop:
    - localsend/localsend
    # - sachaos/todoist

- name: Install Tap Packages
  community.general.homebrew:
    name: "{{ item }}"
    state: present
  environment:
    HOMEBREW_NO_AUTO_UPDATE: "1"
  loop:
    - localsend
    # - todoist

- name: Find all custom fonts
  ansible.builtin.find:
    paths: ~/Code/personal/dotfiles/fonts
    patterns: '*.ttf'
  register: findFonts

- name: Install Fonts
  ansible.builtin.copy:
    src: "{{ item.path }}"
    dest: "/Library/Fonts/{{ item.path | basename }}"
  with_items: "{{ findFonts.files }}"

- name: Install Rosetta
  ansible.builtin.command: softwareupdate --install-rosetta --agree-to-license
