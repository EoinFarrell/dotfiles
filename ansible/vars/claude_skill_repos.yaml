---
# Upstream Claude/agent skill repos to clone and symlink into both
# harnesses' skill dirs (~/.claude/skills, ~/.agents/skills). Split into
# its own vars file (rather than inlined in git_setup.yaml) so the
# satellite repo's own playbook (ansible/setup.yaml in
# $DOTFILES_WD) can load the same source of truth via vars_files when
# resolving a skill overlay's upstream path (ADR 0003) — the satellite
# depends on the root here, never the other way round.
claude_skill_repos:
  - name: mattpocock/skills
    skills:
      - skills/engineering/ask-matt
      - skills/engineering/code-review
      - skills/engineering/codebase-design
      - skills/engineering/diagnosing-bugs
      - skills/engineering/domain-modeling
      - skills/engineering/grill-with-docs
      - skills/engineering/implement
      - skills/engineering/improve-codebase-architecture
      - skills/engineering/prototype
      - skills/engineering/research
      - skills/engineering/resolving-merge-conflicts
      - skills/engineering/setup-matt-pocock-skills
      - skills/engineering/tdd
      - skills/engineering/to-spec
      - skills/engineering/to-tickets
      - skills/engineering/triage
      - skills/engineering/wayfinder
      - skills/engineering/wizard
      - skills/productivity/grill-me
      - skills/productivity/grilling
      - skills/productivity/handoff
      - skills/productivity/teach
      - skills/productivity/to-questionnaire
      - skills/productivity/wait-what
      - skills/productivity/writing-for-agents
      - skills/in-progress/retro
  - name: cursor/plugins
    skills:
      - pstack/skills/technical-writing
      - pstack/skills/unslop
