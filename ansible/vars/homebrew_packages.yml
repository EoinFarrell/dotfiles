---
# The one place to add a new user/CLI tool for both macOS and Debian.
# See docs/adr/0001-homebrew-for-user-cli-tools.md for the reasoning.
#
# OS-level packages (daemons, kernel modules, drivers) do NOT belong here —
# they stay in the OS-specific apt tasks in ansible/tasks/debian.yaml, or
# in the macOS casks/Rosetta tasks in ansible/tasks/macos.yaml.
homebrew_packages:
  - ansible
  # asdf itself (the runtime-version manager) — not a language runtime, so
  # it belongs here rather than under docs/adr/0002-asdf-for-language-runtimes.md's
  # asdf/.tool-versions. Modern asdf (0.16+) ships as a standalone binary,
  # not the old git-cloned shell-script install tasks/asdf_tool_versions.yaml
  # used to assume — see that file's history for what broke.
  - asdf
  - awscli
  - bat
  - coreutils
  - docker-compose
  - doggo
  - gh
  - git
  - guile
  - helix
  - helm
  - hstr
  - hugo
  - jq
  - kubectl
  - kubectx
  - kubecolor
  - lazydocker
  - lazygit
  - lsd
  - mdcat
  - mysql
  - openssl@3
  - prettier
  - protobuf
  - rsync
  - superfile
  - tealdeer # tldr in rust
  - tig
  - tmux
  - tmuxinator
  - tree
  - watch
  - wget2
  - zsh

# Third-party taps and the formulae that require them.
homebrew_taps:
  - txn2/tap

homebrew_tap_packages:
  - txn2/tap/kubefwd
