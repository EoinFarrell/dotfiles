---
# ansible-playbook -i inventory.ini base_setup.yaml
- name: "Base Setup"
  hosts: 127.0.0.1
  connection: local
  vars_files:
    - vars/homebrew_packages.yml
  tasks:
  - name: Update Homebrew
    community.general.homebrew:
     update_homebrew: true
  - name: Remove Casks
    community.general.homebrew:
      name: "homebrew/cask/{{ item }}"
      state: absent
    loop:
    - obsidian
  - name: Install Casks
    community.general.homebrew:
      name: "homebrew/cask/{{ item }}"
      state: present
    loop:
      - devtoys
      - disk-inventory-x
      - docker
      - firefox
      # - google-chrome
      - grandperspective
      # - http-toolkit
      - jetbrains-toolbox
      - jordanbaird-ice
      - kdiff3
      - maccy
      - postman
      - rectangle
      # - slack
      - spotify
      - tigervnc-viewer
      - visual-studio-code
      - vlc
      # - zoom
  - name: Remove Packages
    community.general.homebrew:
      name: "{{ item }}"
      state: absent
    loop:
    - fzf
  - name: Install shared Homebrew packages
    ansible.builtin.include_tasks: tasks/homebrew_packages.yaml
  - name: Install macOS-only Homebrew packages
    community.general.homebrew:
      name: "{{ item }}"
      state: present
    loop:
      # colima is a Docker Desktop replacement for macOS; Debian already
      # runs Docker Engine natively via apt, so it has no use there.
      - colima
  # localsend and its tap are kept macOS-only rather than moved into the
  # shared vars/homebrew_packages.yml list, since it's a GUI send/receive
  # app with no meaningful Linux install path here (same reasoning as the
  # casks above).
  - name: Tap Homebrew repositorys
    community.general.homebrew_tap:
      name: "{{ item }}"
      state: present
    loop:
      - localsend/localsend
      # - sachaos/todoist
  - name: Install Tap Packages
    community.general.homebrew:
      name: "{{ item }}"
      state: present
    loop:
      - localsend
      # - todoist
  - name: Install asdf Node.js
    ansible.builtin.include_tasks: tasks/asdf_nodejs.yaml
  - name: Check zshrc exists
    stat:
      path: ~/.zshrc
    register: ohMyZshContents
  - name: Download Oh My Zsh Installer
    command: wget2 https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh
    when: not ohMyZshContents.stat.exists
  - name: Run Zsh Installer
    command: sh install.sh
    when: not ohMyZshContents.stat.exists
  - name: Delete Zsh Installer
    command: rm install.sh
    when: not ohMyZshContents.stat.exists
  - name: Delete existing Zshrc
    command: rm ~/.zshrc
    when: not ohMyZshContents.stat.exists
  - name: Find all custom fonts
    find:
      paths: ~/Code/personal/dotfiles/fonts
      patterns: '*.ttf'
    register: findFonts
  - name: Install Fonts
    ansible.builtin.copy:
      src: "{{ item.path }}"
      dest: "/Library/Fonts/{{ item.path | basename }}"
    with_items: "{{ findFonts.files }}"
  - name: Install Rosetta
    command: softwareupdate --install-rosetta --agree-to-license