---
# ansible-playbook -i inventory.ini nvidia_setup.yaml -Kk
- name: "Nvidia Setup"
  hosts: nr200p
  become: true
  tasks:
    # lineinfile instead of the deprecated apt_repository; nvidia-driver lives in non-free
    - name: Ensure the Debian bookworm apt source has contrib and non-free
      ansible.builtin.lineinfile:
        path: /etc/apt/sources.list
        regexp: '^deb http://deb\.debian\.org/debian/ bookworm main contrib non-free non-free-firmware$'
        line: "deb http://deb.debian.org/debian/ bookworm main contrib non-free non-free-firmware"
      register: debian_source

    # The installer's security line only has non-free-firmware. bookworm-security then offers the
    # new firmware-nvidia-gsp (535.309.01) without the matching nvidia-kernel-dkms (in non-free),
    # so PackageKit removed nvidia-driver to resolve it and the screen fell back to efifb 800x600.
    - name: Add non-free to the bookworm-security apt source (driver + firmware must update together)
      ansible.builtin.lineinfile:
        path: /etc/apt/sources.list
        regexp: '^deb http://security.debian.org/debian-security bookworm-security '
        line: "deb http://security.debian.org/debian-security bookworm-security main contrib non-free non-free-firmware"
      register: security_source

    - name: Refresh apt cache after changing sources
      apt:
        update_cache: true
      when: debian_source is changed or security_source is changed
    
    # - name: somerepo | no apt key
    #   ansible.builtin.get_url:
    #     url: http://repo.steampowered.com/steam/archive/stable/steam.gpg
    #     dest: /etc/apt/keyrings/steam.asc
    #     # checksum: sha256:bb42f0db45d46bab5f9ec619e1a47360b94c27142e57aa71f7050d08672309e0
    # - name: somerepo | apt source
    #   ansible.builtin.apt_repository:
    #     repo: "deb [arch=amd64,i386 signed-by=/etc/apt/keyrings/steam.asc] http://repo.steampowered.com/steam/ stable steam"
    #     state: present


    - name: Update and upgrade apt packages
      apt:
        upgrade: yes
        update_cache: yes
        cache_valid_time: 86400
    - name: Install NVIDIA driver
      apt:
        pkg:
          - nvidia-driver
          - firmware-misc-nonfree
        state: present
        update_cache: true
      register: nvidia_driver
    # GPU in Docker containers on this host. The "nvidia" runtime entry itself lives in the
    # homelab repo's ansible/files/docker/daemon.nr200p.eoinf.com.json (setup_agent.yaml), so do
    # NOT run `nvidia-ctk runtime configure` here: it would rewrite /etc/docker/daemon.json.
    - name: Add the NVIDIA container toolkit apt signing key
      ansible.builtin.get_url:
        url: https://nvidia.github.io/libnvidia-container/gpgkey
        dest: /etc/apt/keyrings/nvidia-container-toolkit.asc
        mode: "0644"
    - name: Add the NVIDIA container toolkit apt source
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/nvidia-container-toolkit.list
        content: "deb [signed-by=/etc/apt/keyrings/nvidia-container-toolkit.asc] https://nvidia.github.io/libnvidia-container/stable/deb/$(ARCH) /\n"
        mode: "0644"
      register: nvidia_ctk_source
    - name: Install nvidia-container-toolkit (provides nvidia-container-runtime)
      ansible.builtin.apt:
        name: nvidia-container-toolkit
        state: present
        update_cache: "{{ nvidia_ctk_source is changed }}"
    - name: Add arch
      command: dpkg --add-architecture i386
    - name: Update and upgrade apt packages
      apt:
        upgrade: yes
        update_cache: yes
        cache_valid_time: 86400
    - name: Install base packages
      apt:
        pkg:
          - steam-installer
          - mesa-vulkan-drivers
          - mesa-vulkan-drivers:i386
          - libglx-mesa0:i386
          - libglx-mesa0:amd64
          - libgl1-mesa-dri:amd64
          - libgl1-mesa-dri:i386
          - libgl1-mesa-glx:amd64
          - libgl1-mesa-glx:i386
          # - steam-launcher

    - name: Check if a reboot is required.
      ansible.builtin.stat:
        path: /var/run/reboot-required
        get_checksum: no
      register: reboot_required_file
    - name: Reboot the server (if required).
      ansible.builtin.reboot:
      when: reboot_required_file.stat.exists or nvidia_driver is changed
    - name: Remove dependencies that are no longer required.
      ansible.builtin.apt:
        autoremove: yes