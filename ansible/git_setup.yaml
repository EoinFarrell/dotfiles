---
# ansible-playbook --connection=local --inventory 127.0.0.1, --limit 127.0.0.1 git_setup.yaml
# Also runs as provision.yaml's second play (via import_playbook) — this
# header is for the standalone-relink case.
- name: "Git Setup"
  hosts: 127.0.0.1
  connection: local
  vars_files:
    - vars/claude_skill_repos.yaml
  vars:
    # Reusable lists so they can be referenced by multiple tasks
    personal_repos:
      - dotfiles
      - notes.eoinfarrell.dev

    # List of maps for creating symlinks (src -> dest). Named
    # personal_dotfile_links (not dotfile_links) so provision.yaml can
    # reuse this same var name once the work overlay's equivalent
    # (workday_dotfile_links) is wired in alongside it (Phase 3c).
    #
    # ghostty and lazygit are macOS-only-vs-Linux-XDG splits: on macOS they
    # read ~/Library/Application Support/...; on Linux (Homebrew/Linuxbrew
    # builds of both) they read the XDG ~/.config/... path. Unconditionally
    # listing the macOS path broke on Linux — its parent dir never exists
    # there (nothing creates ~/Library on Linux) — so it's now only added
    # for ansible_facts['os_family'] == 'Darwin'.
    personal_dotfile_links: >-
      {{
        [
          { 'src': '~/Code/personal/dotfiles/zsh/zshrc' , 'dest': '~/.zshrc'},
          { 'src': '~/Code/personal/dotfiles/zsh/zprofile' , 'dest': '~/.zprofile'},
          { 'src': '~/Code/personal/dotfiles/git/.gitignore' , 'dest': '~/.gitignore'},
          { 'src': '~/Code/personal/dotfiles/git/.gitconfig' , 'dest': '~/.gitconfig'},
          { 'src': '~/Code/personal/dotfiles/tmux/.tmux.conf' , 'dest': '~/.tmux.conf'},
          { 'src': '~/Code/personal/dotfiles/tig/.tigrc' , 'dest': '~/.tigrc'},
          { 'src': '~/Code/personal/dotfiles/vim/.vimrc' , 'dest': '~/.vimrc'},
          { 'src': '~/Code/personal/dotfiles/asdf/.asdfrc' , 'dest': '~/.asdfrc'},
          { 'src': '~/Code/personal/dotfiles/asdf/.tool-versions' , 'dest': '~/.tool-versions'},
          { 'src': '~/Code/personal/dotfiles/superfile/hotkeys.toml' , 'dest': '~/.config/superfile/hotkeys.toml'},
          { 'src': '~/Code/personal/dotfiles/bat/config' , 'dest': '~/.config/bat/config'},
          { 'src': '~/Code/personal/dotfiles/ansible/ansible.cfg' , 'dest': '~/.ansible.cfg'},
          { 'src': '~/Code/personal/dotfiles/ghostty/config' , 'dest': '~/.config/ghostty/config'},
          { 'src': '~/Code/personal/dotfiles/lazygit/config.yml' , 'dest': '~/.config/lazygit/config.yml'},
          { 'src': '~/Code/personal/dotfiles/helix/config.toml', 'dest': '~/.config/helix/config.toml'},
          { 'src': '~/Code/personal/dotfiles/sops/sops.yaml' , 'dest': '~/.config/sops/sops.yaml'},
        ] + (
          [
            { 'src': '~/Code/personal/dotfiles/ghostty/config' , 'dest': '~/Library/Application Support/com.mitchellh.ghostty/config'},
            { 'src': '~/Code/personal/dotfiles/lazygit/config.yml' , 'dest': '~/Library/Application Support/lazygit/config.yml'},
          ] if ansible_facts['os_family'] == 'Darwin' else []
        )
      }}

    # Derived from personal_dotfile_links' dest paths rather than
    # hand-maintained: every dest's parent dir needs to exist before
    # tasks/link_dotfiles.yaml can create the symlink there, and keeping a
    # separate hand-written list is exactly how the ~/Library/Application
    # Support/... dirs above went uncreated for so long.
    link_dirs: "{{ personal_dotfile_links | map(attribute='dest') | map('dirname') | unique | list }}"

    # Placeholder for files to remove before creating links (maps with src/dest)
    remove_dotfiles: []

    # claude_skill_repos itself now lives in vars/claude_skill_repos.yaml
    # (loaded via vars_files above) so the satellite repo's playbook can
    # load the same list — see that file's header comment.
    claude_link_dirs:
      - ~/.claude/skills
      - ~/.agents/skills

    # ADR 0003: per-skill overlay patches, keyed by destination symlink
    # basename, materialized into build_dir_root before linking.
    claude_skill_overlays_dir: "{{ playbook_dir }}/../claude/skill-overlays"
    claude_skill_build_dir_root: ~/Code/claude/.build
    # Per-skill copies whose SKILL.md `name:` carries the repo prefix (Claude
    # Code shows the frontmatter name, not the symlink name).
    claude_prefixed_build_dir_root: ~/Code/claude/.build-prefixed
  tasks:
  - name: Setup Code dirs
    ansible.builtin.file:
      path: ~/Code/personal
      state: directory
      recurse: yes
  - name: Clone personal repos
    ansible.builtin.git:
      repo: "https://github.com/EoinFarrell/{{ item }}.git"
      dest: ~/Code/personal/{{ item }}
      update: no
    loop: "{{ personal_repos }}"
  - name: Link personal dotfiles
    ansible.builtin.include_tasks: tasks/link_dotfiles.yaml
    vars:
      links: "{{ personal_dotfile_links }}"
  - name: Link oh-my-zsh custom scripts
    ansible.builtin.include_tasks: tasks/link_tree.yaml
    vars:
      src_root: "{{ ansible_facts['env']['HOME'] }}/Code/personal/dotfiles/zsh/oh-my-zsh"
      dest_root: "{{ ansible_facts['env']['HOME'] }}/.oh-my-zsh/custom"
      patterns: '*.zsh'
  - name: Link tmuxinator configs
    ansible.builtin.include_tasks: tasks/link_tree.yaml
    vars:
      src_root: "{{ ansible_facts['env']['HOME'] }}/Code/personal/dotfiles/tmuxinator"
      dest_root: "{{ ansible_facts['env']['HOME'] }}/.config/tmuxinator"
  # Folded in from the formerly-orphaned tldr_setup.yaml (Phase 3b). tldr
  # pages live under $DOTFILES/../notes.eoinfarrell.dev/tldr and are used
  # on every machine, not just macOS — tealdeer's own default pages dir
  # differs per OS (confirmed against docs.tealdeer.org and this machine),
  # so dest_root is OS-conditional rather than a single hardcoded path.
  - name: Link tldr custom pages
    ansible.builtin.include_tasks: tasks/link_tree.yaml
    vars:
      src_root: "{{ ansible_facts['env']['HOME'] }}/Code/personal/notes.eoinfarrell.dev/tldr"
      dest_root: >-
        {{ (ansible_facts['env']['HOME'] ~ '/Library/Application Support/tealdeer/pages')
           if ansible_facts['os_family'] == 'Darwin'
           else (ansible_facts['env']['HOME'] ~ '/.local/share/tealdeer/pages') }}
  # Folded in from the formerly-orphaned claude.yaml (Phase 3b). Uses
  # prune_unmanaged since ~/.claude/skills and ~/.agents/skills exist only
  # to hold these managed symlinks — unlike personal_dotfile_links' targets,
  # which are scattered across $HOME and must never be broadly pruned.
  - name: Setup Claude Code dirs
    ansible.builtin.file:
      path: ~/Code/claude
      state: directory
      recurse: yes
  # scripts/build_skills.py does the clone (update: no semantics), overlay
  # (ADR 0003) and prefixed-copy steps in one go so the Hermes container, which
  # has no Ansible, builds identical skills from the same
  # vars/claude_skill_repos.yaml. It runs under ansible_playbook_python because
  # that interpreter always has a YAML parser. --json keeps a drifted overlay
  # out of the exit code: it lands in skill_overlay_failures below and fails the
  # play last, as before. tasks/materialize_*.yaml are no longer called from
  # here; the satellite play may still include them, and relies on the
  # skill_overlay_results / prefixed_skills facts and the .build dir set here.
  - name: Build Claude skills (clone, overlay, prefix)
    ansible.builtin.command:
      argv:
        - "{{ ansible_playbook_python }}"
        - "{{ playbook_dir }}/../scripts/build_skills.py"
        - --repos-file
        - "{{ playbook_dir }}/vars/claude_skill_repos.yaml"
        - --overlays-dir
        - "{{ claude_skill_overlays_dir }}"
        - --clone-root
        - ~/Code/claude
        - --out
        - "{{ claude_prefixed_build_dir_root }}"
        - --overlay-build-dir
        - "{{ claude_skill_build_dir_root }}"
        - --json
    register: _build_skills
    changed_when: false
  - name: Record skill overlay results
    ansible.builtin.set_fact:
      skill_overlay_results: "{{ (_build_skills.stdout | from_json).overlays }}"
      skill_overlay_failures: "{{ (_build_skills.stdout | from_json).failures }}"
  - name: Build prefixed skill list from claude_skill_repos
    vars:
      _basename: "{{ item.1 | basename }}"
      _overlay_result: "{{ skill_overlay_results | selectattr('basename', 'equalto', _basename) | list }}"
      _src: "{{ _overlay_result[0].build_dir if _overlay_result | length > 0 else '~/Code/claude/' + item.0.name + '/' + item.1 }}"
    ansible.builtin.set_fact:
      prefixed_skills: "{{ prefixed_skills | default([]) + [{'src': _src, 'dest_name': item.0.prefix + '-' + _basename}] }}"
    loop: "{{ claude_skill_repos | subelements('skills') }}"
    loop_control:
      label: "{{ item.1 | basename }}"
  - name: Build claude_dotfile_links from prefixed copies
    ansible.builtin.set_fact:
      claude_dotfile_links: "{{ claude_dotfile_links | default([]) + [{'src': claude_prefixed_build_dir_root + '/' + item.dest_name, 'dest': '~/.claude/skills/' + item.dest_name}, {'src': claude_prefixed_build_dir_root + '/' + item.dest_name, 'dest': '~/.agents/skills/' + item.dest_name}] }}"
    loop: "{{ prefixed_skills }}"
    loop_control:
      label: "{{ item.dest_name }}"
  - name: Link Claude skills
    ansible.builtin.include_tasks: tasks/link_dotfiles.yaml
    vars:
      links: "{{ claude_dotfile_links }}"
      link_dirs: "{{ claude_link_dirs }}"
      prune_unmanaged: true
  - name: Fail if any skill overlay could not be applied
    # Runs last so every other skill still gets linked this run — a
    # drifted overlay reports loudly (ADR 0003) rather than blocking
    # provisioning for skills unrelated to it.
    ansible.builtin.fail:
      msg: >-
        {{ skill_overlay_failures | length }} skill overlay(s) failed to
        apply against current upstream content, likely due to upstream
        drift: {{ skill_overlay_failures | map(attribute='basename') | list }}.
        Reconcile each overlay patch by hand (see the 'error' field on each
        entry for git apply's message) before re-running.
    when: skill_overlay_failures | length > 0
  - name: Clone fzf-tab plugin
    ansible.builtin.git:
      repo: "https://github.com/Aloxaf/fzf-tab.git"
      dest: ~/.oh-my-zsh/custom/plugins/fzf-tab
      update: yes
  - name: Install gitstatus binary for powerlevel10k
    ansible.builtin.shell:
      cmd: ~/.oh-my-zsh/custom/themes/powerlevel10k/gitstatus/install
      creates: ~/.oh-my-zsh/custom/themes/powerlevel10k/gitstatus/usrbin/gitstatusd-darwin-arm64
